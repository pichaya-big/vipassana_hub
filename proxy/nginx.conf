# Reverse proxy: single entry point for the whole app
#   /api/*  -> Node.js server (port 4000)
#   /*      -> Next.js client (port 3000)

upstream client_upstream {
    server client:3000;
}

upstream server_upstream {
    server server:4000;
}

# Maps the Upgrade header so WebSocket connections (Next.js HMR in dev) work
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Lesson videos are limited to MAX_VIDEO_MB (50) in server/.env. Keep this above that, with room for the form.
    client_max_body_size 60m;

    # Forwarding headers used by both apps
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Node.js API. Trailing slash-less proxy_pass keeps the /api prefix,
    # so the request reaches Express as /api/health
    location /api/ {
        proxy_pass http://server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Uploads of large videos can take minutes on slow connections
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Next.js client (pages, static assets, HMR websocket)
    location / {
        proxy_pass http://client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
